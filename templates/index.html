<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
</head>
<body>
    <h1>Budget Tracker</h1>
    <h2>Total: {{ total }}</h2>

    <form method="POST" action="/add">
        Date: <input type="date" name="date" required><br>
        Category: <input type="text" name="category" required><br>
        Description: <input type="text" name="description"><br>
        Amount: <input type="number" step="0.01" name="amount" required><br>
        <button type="submit">Add Transaction</button>
    </form>

    <form method="GET" action="/">
        <label for="category">Filter by Category:</label>
        <select name="category" id="category">
            <option value="">All</option>
            {% for c in categories %}
                <option value="{{ c }}" {% if current_filter == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>

    <h2>Transactions</h2>
    <ul>
        {% for t in transactions %}
            <li>
                {{t.date}} | {{t.category}} | {{t.description}} | {{t.amount}}
                <form method="POST" action="/delete/{{ t.id }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
