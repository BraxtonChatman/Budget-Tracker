<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Transaction</h1>

    <div class="form-container">
        <form method="POST" action="{{ url_for('edit_transaction', tx_id=transaction.id) }}">
            Date: <input type="date" name="date" class="form-input" value="{{ transaction.date }}" required><br>
            Category:
            <select name="category" required>
                {% for c in categories %}
                    <option value="{{ c.id }}"
                        {% if transaction.category_id == c.id %}selected{% endif %}>
                        {{ c.name }}
                    </option>
                {% endfor %}
            </select>
            Description: <input type="text" name="description" class="form-input" value="{{ transaction.description }}"><br>
            <select name="type" required>
                <option value="Expense" {% if transaction.type == 'Expense' %}selected{% endif %}>Expense</option>
                <option value="Income" {% if transaction.type == 'Income' %}selected{% endif %}>Income</option>
            </select>
            Amount: <input type="number" step="0.01" name="amount" class="form-input" value="{{ transaction.amount }}" required><br>
            <button type="submit">Update Transaction</button>
        </form>
    </div>

    <a href="{{ url_for('index') }}">Cancel</a>
</body>
</html>
