<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
</head>
<body>
    <h1>Edit Transaction</h1>

    <form method="POST" action="{{ url_for('edit_transaction', tx_id=transaction.id) }}">
        Date: <input type="date" name="date" value="{{ transaction.date }}" required><br>
        Category:
        <select name="category" required>
            {% for c in categories %}
                <option value="{{ c.id }}"
                    {% if transaction.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>
        Description: <input type="text" name="description" value="{{ transaction.description }}"><br>
        Amount: <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" required><br>
        <button type="submit">Update Transaction</button>
    </form>

    <a href="{{ url_for('index') }}">Cancel</a>
</body>
</html>
